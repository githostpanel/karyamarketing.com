<!DOCTYPE html>
<html lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Login | Propeller - Admin Dashboard">
    <meta content="width=device-width, initial-scale=1, user-scalable=no" name="viewport">
    <title>Karya Marketing Apps</title>
    <link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">

    <!-- Google icon -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"> -->

    <!-- Load Bootstrap and Propeller core stylesheets -->
    <link rel="stylesheet" type="text/css" href="assets/css/bootstrap.css">

    <link id="css-mode" rel="stylesheet" type="text/css" href="assets/css/style-light.css">

    <style type="text/css">
    
    </style>
</head>

<body class="body">
    <div class="container">
        <div class="hero-header">
            <h1>Karya Marketing Apps</h1>
            <p>get your favorite app</p>
        </div>
        <button id="darkModeToggle">
            <i id="darkModeIcon" class="material-icons">brightness_4</i> <!-- Dark Mode Icon -->
        </button>
        <input type="text" id="searchInput" placeholder="Search by title">
        <div id="output"></div>
    </div>

    <!-- Scripts Starts -->
    <script src="assets/js/jquery-1.12.2.min.js"></script>
    <script src="assets/js/bootstrap.js"></script>
    <script src="assets/js/propeller.js"></script>
    <script type="text/javascript">
        $(document).ready(function () {
            var darkModeIcon = $('#darkModeIcon');
            var propellerTheme = $('#css-mode');
            var output = $('#output');
            var searchInput = $('#searchInput');

            $('#darkModeToggle').click(function () {
                $('body').toggleClass('dark-mode');
                if ($('body').hasClass('dark-mode')) {
                    darkModeIcon.text('brightness_7');
                    propellerTheme.attr('href', 'assets/css/style-dark.css');
                } else {
                    darkModeIcon.text('brightness_4');
                    propellerTheme.attr('href', 'assets/css/style-light.css');
                }
            });

            function renderItems(items) {
                output.empty();

                $.each(items, function (index, item) {
                    var itemHtml = `
                        <div>
                            <a href="${item.link}">
                                <div style="margin-top: 14px;" class="pmd-card pmd-card-default pmd-z-depth">
                                    <div class="pmd-card-title">
                                        <div class="media-left">
                                            <img style="border-radius: 8px;" width="60" height="60" src="${item.image}">
                                        </div>
                                        <div class="media-body media-middle">
                                            <div class="title-app">${item.title}</div>
                                            <b><div style="color: #2196f3; font-size: 20px;">${item.price}</div></b>
                                        </div>
                                    </div>
                                </div>
                            </a>
                        </div>`;
                    output.append(itemHtml);
                });
            }

            function fetchData() {
                $.ajax({
                    url: 'assets/json/data.json',
                    dataType: 'json',
                    success: function (data) {
                        renderItems(data);
                    },
                    error: function (xhr, status, error) {
                        console.error('Error fetching data:', error);
                    }
                });
            }

            searchInput.on('input', function () {
                var searchTerm = searchInput.val().toLowerCase();

                $.ajax({
                    url: 'assets/json/data.json',
                    dataType: 'json',
                    success: function (data) {
                        var filteredData = $.grep(data, function (item) {
                            return item.title.toLowerCase().includes(searchTerm);
                        });
                        renderItems(filteredData);
                    },
                    error: function (xhr, status, error) {
                        console.error('Error fetching data:', error);
                    }
                });
            });

            fetchData();
        });
    </script>

</body>

</html>
